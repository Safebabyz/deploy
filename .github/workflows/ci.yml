name: test

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Test
        run: |
          npm run build --silent
          output=$(node dist/Test1.js)
          # Capture the exit code of the previous command
          exit_code=$?

          # Check the exit code to determine if there was an error
          if [ $exit_code -ne 0 ]; then
            echo "Error: The Node.js script failed with exit code $exit_code"
            exit 1  # Exit the workflow with an error code
          fi

      - name: Unit Test Success
        if: success()
        run: echo "✅ Unit tests passed successfully!"

      - name: Unit Test Failed
        if: failure()
        run: echo "❌ Unit tests failed!"

  integration-test:
    runs-on: ubuntu-latest
    needs: unit-test
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build --silent

      - name: Start server in background
        run: node dist/index.js &

      - name: Wait for server to be ready
        run: sleep 3

      - name: Run Integration Test
        run: node dist/IntegrationTest.js

      - name: Integration Test Success
        if: success()
        run: echo "✅ Integration tests passed successfully!"

      - name: Integration Test Failed
        if: failure()
        run: echo "❌ Integration tests failed!"
