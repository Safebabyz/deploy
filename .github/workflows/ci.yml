name: test

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Test
        run: |
          npm run build --silent
          output=$(node dist/Test1.js)
          # Capture the exit code of the previous command
          exit_code=$?

          # Check the exit code to determine if there was an error
          if [ $exit_code -ne 0 ]; then
            echo "Error: The Node.js script failed with exit code $exit_code"
            exit 1  # Exit the workflow with an error code
          fi

      - name: Unit Test Success
        if: success()
        run: echo "✅ Unit tests passed successfully!"

      - name: Unit Test Failed
        if: failure()
        run: echo "❌ Unit tests failed!"

  integration-test:
    runs-on: ubuntu-latest
    needs: unit-test
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build --silent

      - name: Start server in background
        run: node dist/index.js &

      - name: Wait for server to be ready
        run: sleep 3

      # ── ① Failed scenario ──────────────────────────────────────────
      - name: Run Integration Test (Fail scenario)
        id: integration-fail
        run: node dist/IntegrationTestFail.js
        continue-on-error: true

      - name: "❌ Integration Test Failed"
        if: steps.integration-fail.outcome == 'failure'
        run: echo "❌ Integration test failed (as expected in fail scenario)"

      # ── ② Success scenario ─────────────────────────────────────────
      - name: Run Integration Test (Success scenario)
        id: integration-success
        run: node dist/IntegrationTest.js
        continue-on-error: true

      - name: "✅ Integration Test Passed"
        if: steps.integration-success.outcome == 'success'
        run: echo "✅ Integration test passed successfully!"

      - name: "❌ Integration Test Unexpected Failure"
        if: steps.integration-success.outcome == 'failure'
        run: |
          echo "❌ Integration test failed unexpectedly!"
          exit 1
